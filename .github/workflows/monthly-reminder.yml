name: Monthly Subscriber Reminder Dispatch

on:
  # Automatically runs on the 25th of every month at 09:00 UTC
  schedule:
    - cron: '0 9 25 * *'
  
  # Allows you to test or trigger it anytime manually from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Monthly Reminder Dispatch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: node scripts/send-monthly-reminder.js
