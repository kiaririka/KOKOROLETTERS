name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview (static, no server)
        # .env.preview is committed and sets VITE_PREVIEW=true
        # --mode preview tells Vite to load .env.preview automatically
        # --base=./ makes all asset URLs relative (works from any subpath on gh-pages)
        run: npm run build:preview

      # GitHub Pages has no server, so any deep URL (e.g. /somepath) returns 404.
      # Copy index.html as 404.html so the SPA's client-side router handles all paths.
      - name: Create 404.html for SPA routing
        run: cp dist-preview/index.html dist-preview/404.html

      # Remove any CNAME so GitHub Pages uses the default kiaririka.github.io URL.
      - name: Remove custom domain (CNAME)
        run: rm -f dist-preview/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
